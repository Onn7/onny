<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online - Es Lumut & Tahu Jeletot</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes checkmark {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-checkmark { animation: checkmark 0.5s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const products = [
            { 
                id: 1, 
                name: "Es Lumut Taro", 
                price: 6000, 
                category: "Minuman", 
                image: "taro.jpg",
                description: "Es lumut dengan rasa taro yang creamy dan manis" 
            },
            { 
                id: 2, 
                name: "Es Lumut Matcha", 
                price: 6000, 
                category: "Minuman", 
                image: "matcha.jpg",
                description: "Es lumut dengan rasa matcha hijau yang segar" 
            },
            { 
                id: 3, 
                name: "Es Lumut Coklat", 
                price: 6000, 
                category: "Minuman", 
                image: "coklat.jpg",
                description: "Es lumut dengan rasa coklat yang kaya dan lezat" 
            },
            { 
                id: 4, 
                name: "Es Lumut Red Velvet", 
                price: 6000, 
                category: "Minuman", 
                image: "red velvet.jpg",
                description: "Es lumut dengan rasa red velvet yang unik dan nikmat" 
            },
            { 
                id: 5, 
                name: "Es Lumut Stroberi", 
                price: 6000, 
                category: "Minuman", 
                image: "stroberi.jpg",
                description: "Es lumut dengan rasa stroberi yang manis dan segar" 
            },
            { 
                id: 6, 
                name: "Tahu Jeletot", 
                price: 2500, 
                category: "Makanan", 
                image: "Tahu-Jeletot.jpg",
                description: "Tahu goreng dengan bumbu pedas yang menggugah selera" 
            },
        ];

        function App() {
            const [cart, setCart] = useState([]);
            const [showCart, setShowCart] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState("Semua");
            const [showCheckout, setShowCheckout] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false);
            const [orderData, setOrderData] = useState({
                name: '',
                phone: '',
                email: '',
                address: '',
                city: '',
                postalCode: '',
                paymentMethod: 'transfer',
                notes: ''
            });
            const [orderNumber, setOrderNumber] = useState('');
            const [completedOrder, setCompletedOrder] = useState(null);
            const [formErrors, setFormErrors] = useState({});

            const addToCart = (product) => {
                const existingItem = cart.find(item => item.id === product.id);
                if (existingItem) {
                    setCart(cart.map(item => 
                        item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
                    ));
                } else {
                    setCart([...cart, { ...product, quantity: 1 }]);
                }
            };

            const removeFromCart = (productId) => {
                setCart(cart.filter(item => item.id !== productId));
            };

            const updateQuantity = (productId, change) => {
                setCart(cart.map(item => {
                    if (item.id === productId) {
                        const newQuantity = item.quantity + change;
                        return newQuantity > 0 ? { ...item, quantity: newQuantity } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const getTotal = () => {
                return cart.reduce((total, item) => total + (item.price * item.quantity), 0);
            };

            const formatPrice = (price) => {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(price);
            };

            const formatPricePDF = (price) => {
                return 'Rp ' + new Intl.NumberFormat('id-ID').format(price);
            };

            const filteredProducts = selectedCategory === "Semua" 
                ? products 
                : products.filter(p => p.category === selectedCategory);

            const categories = ["Semua", "Minuman", "Makanan"];

            const handleCheckout = () => {
                if (cart.length === 0) {
                    alert('Keranjang belanja kosong!');
                    return;
                }
                setShowCart(false);
                setShowCheckout(true);
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setOrderData({ ...orderData, [name]: value });
                if (formErrors[name]) {
                    setFormErrors({ ...formErrors, [name]: '' });
                }
            };

            const validateForm = () => {
                const errors = {};
                if (!orderData.name.trim()) errors.name = 'Nama wajib diisi';
                if (!orderData.phone.trim()) errors.phone = 'Telepon wajib diisi';
                if (!orderData.email.trim()) errors.email = 'Email wajib diisi';
                else if (!/\S+@\S+\.\S+/.test(orderData.email)) errors.email = 'Format email tidak valid';
                if (!orderData.address.trim()) errors.address = 'Alamat wajib diisi';
                if (!orderData.city.trim()) errors.city = 'Kota wajib diisi';
                if (!orderData.postalCode.trim()) errors.postalCode = 'Kode pos wajib diisi';
                return errors;
            };

            const handleSubmitOrder = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                const errors = validateForm();
                if (Object.keys(errors).length > 0) {
                    setFormErrors(errors);
                    alert('Mohon lengkapi semua data yang diperlukan!');
                    return;
                }

                const orderNum = 'ORD-' + Date.now().toString().slice(-8);
                setOrderNumber(orderNum);

                const orderDetails = {
                    orderNumber: orderNum,
                    date: new Date().toLocaleString('id-ID'),
                    customer: { ...orderData },
                    items: [...cart],
                    subtotal: getTotal(),
                    shipping: 0,
                    total: getTotal()
                };

                setCompletedOrder(orderDetails);

                setShowCheckout(false);
                setShowSuccess(true);

                setCart([]);
                
                setOrderData({
                    name: '',
                    phone: '',
                    email: '',
                    address: '',
                    city: '',
                    postalCode: '',
                    paymentMethod: 'transfer',
                    notes: ''
                });
                setFormErrors({});
            };

            const generatePDF = () => {
                console.log('generatePDF dipanggil');
                console.log('completedOrder:', completedOrder);

                if (!completedOrder) {
                    alert('Data pesanan tidak ditemukan!');
                    return;
                }

                if (!window.jspdf || !window.jspdf.jsPDF) {
                    alert('Library PDF belum tersedia. Silakan refresh halaman dan coba lagi.');
                    console.error('jsPDF library not loaded');
                    return;
                }

                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const order = completedOrder;
                    let yPos = 20;

                    doc.setFontSize(20);
                    doc.setFont('helvetica', 'bold');
                    doc.text('TOKO ONLINE', 105, yPos, { align: 'center' });
                    yPos += 8;
                    
                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'normal');
                    doc.text('Jl. Contoh No. 123, Jakarta', 105, yPos, { align: 'center' });
                    yPos += 5;
                    doc.text('Telp: (021) 1234-5678 | Email: info@tokoonline.com', 105, yPos, { align: 'center' });
                    yPos += 10;

                    doc.setLineWidth(0.5);
                    doc.line(20, yPos, 190, yPos);
                    yPos += 10;

                    doc.setFontSize(16);
                    doc.setFont('helvetica', 'bold');
                    doc.text('NOTA PESANAN', 105, yPos, { align: 'center' });
                    yPos += 10;

                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'normal');
                    doc.text('Nomor Pesanan: ' + order.orderNumber, 20, yPos);
                    doc.text('Tanggal: ' + order.date, 20, yPos + 6);
                    yPos += 15;

                    doc.setFont('helvetica', 'bold');
                    doc.text('DATA PELANGGAN', 20, yPos);
                    yPos += 6;
                    
                    doc.setFont('helvetica', 'normal');
                    doc.text('Nama: ' + order.customer.name, 20, yPos);
                    yPos += 5;
                    doc.text('Telepon: ' + order.customer.phone, 20, yPos);
                    yPos += 5;
                    doc.text('Email: ' + order.customer.email, 20, yPos);
                    yPos += 5;
                    doc.text('Alamat: ' + order.customer.address, 20, yPos);
                    yPos += 5;
                    doc.text('Kota: ' + order.customer.city + ' ' + order.customer.postalCode, 20, yPos);
                    yPos += 10;

                    const paymentMethods = {
                        'transfer': 'Transfer Bank',
                        'ewallet': 'E-Wallet',
                        'cod': 'COD (Bayar di Tempat)'
                    };
                    doc.text('Metode Pembayaran: ' + paymentMethods[order.customer.paymentMethod], 20, yPos);
                    yPos += 10;

                    doc.setLineWidth(0.3);
                    doc.line(20, yPos, 190, yPos);
                    yPos += 6;
                    
                    doc.setFont('helvetica', 'bold');
                    doc.text('Item', 20, yPos);
                    doc.text('Qty', 110, yPos, { align: 'center' });
                    doc.text('Harga', 140, yPos, { align: 'right' });
                    doc.text('Subtotal', 190, yPos, { align: 'right' });
                    yPos += 3;
                    doc.line(20, yPos, 190, yPos);
                    yPos += 6;

                    doc.setFont('helvetica', 'normal');
                    order.items.forEach(item => {
                        const itemName = item.name.length > 30 ? item.name.substring(0, 30) + '...' : item.name;
                        doc.text(itemName, 20, yPos);
                        doc.text(item.quantity.toString(), 110, yPos, { align: 'center' });
                        doc.text(formatPricePDF(item.price), 140, yPos, { align: 'right' });
                        doc.text(formatPricePDF(item.price * item.quantity), 190, yPos, { align: 'right' });
                        yPos += 6;
                    });

                    yPos += 5;
                    doc.line(20, yPos, 190, yPos);
                    yPos += 8;

                    doc.text('Subtotal:', 140, yPos, { align: 'right' });
                    doc.text(formatPricePDF(order.subtotal), 190, yPos, { align: 'right' });
                    yPos += 6;
                    
                    doc.text('Ongkos Kirim:', 140, yPos, { align: 'right' });
                    doc.text('GRATIS', 190, yPos, { align: 'right' });
                    yPos += 3;
                    doc.line(140, yPos, 190, yPos);
                    yPos += 6;

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(12);
                    doc.text('TOTAL:', 140, yPos, { align: 'right' });
                    doc.text(formatPricePDF(order.total), 190, yPos, { align: 'right' });
                    yPos += 15;

                    if (order.customer.notes) {
                        doc.setFontSize(10);
                        doc.setFont('helvetica', 'bold');
                        doc.text('Catatan:', 20, yPos);
                        yPos += 5;
                        doc.setFont('helvetica', 'normal');
                        const splitNotes = doc.splitTextToSize(order.customer.notes, 170);
                        doc.text(splitNotes, 20, yPos);
                        yPos += splitNotes.length * 5 + 10;
                    }

                    yPos = 260;
                    doc.setFontSize(9);
                    doc.setFont('helvetica', 'italic');
                    doc.text('Terima kasih telah berbelanja di Toko Online kami!', 105, yPos, { align: 'center' });
                    yPos += 5;
                    doc.text('Barang yang sudah dibeli tidak dapat dikembalikan atau ditukar.', 105, yPos, { align: 'center' });

                    const filename = 'Nota-' + order.orderNumber + '.pdf';
                    doc.save(filename);
                    console.log('PDF berhasil disimpan:', filename);
                } catch (error) {
                    console.error('Error generating PDF:', error);
                    alert('Gagal membuat PDF: ' + error.message);
                }
            };

            const closeSuccess = () => {
                setShowSuccess(false);
                setCompletedOrder(null);
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white shadow-md sticky top-0 z-40">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex justify-between items-center">
                                <h1 className="text-2xl font-bold text-blue-600">🛍️ Toko Es Lumut & Tahu Jeletot</h1>
                                <button 
                                    onClick={() => setShowCart(!showCart)}
                                    className="relative bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors"
                                >
                                    Keranjang
                                    {cart.length > 0 && (
                                        <span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center">
                                            {cart.reduce((sum, item) => sum + item.quantity, 0)}
                                        </span>
                                    )}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="container mx-auto px-4 py-8">
                        <div className="mb-8">
                            <div className="flex gap-2 flex-wrap">
                                {categories.map(category => (
                                    <button
                                        key={category}
                                        onClick={() => setSelectedCategory(category)}
                                        className={`px-6 py-2 rounded-lg transition-colors ${
                                            selectedCategory === category 
                                                ? 'bg-blue-600 text-white' 
                                                : 'bg-white text-gray-700 hover:bg-gray-100'
                                        }`}
                                    >
                                        {category}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {filteredProducts.map(product => (
                                <div key={product.id} className="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow">
                                    <img 
                                        src={product.image} 
                                        alt={product.name}
                                        className="w-full h-48 object-cover cursor-pointer"
                                        onClick={() => setSelectedProduct(product)}
                                    />
                                    <div className="p-4">
                                        <h3 className="font-semibold text-lg mb-2">{product.name}</h3>
                                        <p className="text-gray-600 text-sm mb-3">{product.description}</p>
                                        <p className="text-blue-600 font-bold text-xl mb-3">{formatPrice(product.price)}</p>
                                        <button 
                                            onClick={() => addToCart(product)}
                                            className="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors"
                                        >
                                            Tambah ke Keranjang
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {showCart && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50" onClick={() => setShowCart(false)}>
                            <div 
                                className="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl overflow-y-auto animate-fade-in"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="p-6">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold">Keranjang Belanja</h2>
                                        <button 
                                            onClick={() => setShowCart(false)}
                                            className="text-gray-500 hover:text-gray-700 text-2xl"
                                        >
                                            ×
                                        </button>
                                    </div>

                                    {cart.length === 0 ? (
                                        <p className="text-gray-500 text-center py-8">Keranjang kosong</p>
                                    ) : (
                                        <>
                                            <div className="space-y-4 mb-6">
                                                {cart.map(item => (
                                                    <div key={item.id} className="flex gap-4 border-b pb-4">
                                                        <img 
                                                            src={item.image} 
                                                            alt={item.name}
                                                            className="w-20 h-20 object-cover rounded"
                                                        />
                                                        <div className="flex-1">
                                                            <h3 className="font-semibold">{item.name}</h3>
                                                            <p className="text-blue-600 font-bold">{formatPrice(item.price)}</p>
                                                            <div className="flex items-center gap-2 mt-2">
                                                                <button 
                                                                    onClick={() => updateQuantity(item.id, -1)}
                                                                    className="w-8 h-8 bg-gray-200 rounded hover:bg-gray-300"
                                                                >
                                                                    -
                                                                </button>
                                                                <span className="w-8 text-center">{item.quantity}</span>
                                                                <button 
                                                                    onClick={() => updateQuantity(item.id, 1)}
                                                                    className="w-8 h-8 bg-gray-200 rounded hover:bg-gray-300"
                                                                >
                                                                    +
                                                                </button>
                                                                <button 
                                                                    onClick={() => removeFromCart(item.id)}
                                                                    className="ml-auto text-red-500 hover:text-red-700"
                                                                >
                                                                    Hapus
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="border-t pt-4">
                                                <div className="flex justify-between items-center mb-4">
                                                    <span className="text-lg font-semibold">Total:</span>
                                                    <span className="text-2xl font-bold text-blue-600">{formatPrice(getTotal())}</span>
                                                </div>
                                                <button 
                                                    onClick={handleCheckout}
                                                    className="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition-colors font-semibold"
                                                >
                                                    Checkout
                                                </button>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showCheckout && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-white rounded-lg max-w-3xl w-full my-8 animate-fade-in" onClick={(e) => e.stopPropagation()}>
                                <div className="p-6">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold">Checkout</h2>
                                        <button 
                                            onClick={() => setShowCheckout(false)}
                                            className="text-gray-500 hover:text-gray-700 text-2xl"
                                        >
                                            ×
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <h3 className="text-lg font-semibold mb-4 text-blue-600">📦 Data Pengiriman</h3>
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap *</label>
                                                    <input
                                                        type="text"
                                                        name="name"
                                                        value={orderData.name}
                                                        onChange={handleInputChange}
                                                        className={`w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent ${formErrors.name ? 'border-red-500' : 'border-gray-300'}`}
                                                        placeholder="Masukkan nama lengkap"
                                                    />
                                                    {formErrors.name && <p className="text-red-500 text-xs mt-1">{formErrors.name}</p>}
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nomor Telepon *</label>
                                                    <input
                                                        type="tel"
                                                        name="phone"
                                                        value={orderData.phone}
                                                        onChange={handleInputChange}
                                                        className={`w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent ${formErrors.phone ? 'border-red-500' : 'border-gray-300'}`}
                                                        placeholder="08xxxxxxxxxx"
                                                    />
                                                    {formErrors.phone && <p className="text-red-500 text-xs mt-1">{formErrors.phone}</p>}
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                                                    <input
                                                        type="email"
                                                        name="email"
                                                        value={orderData.email}
                                                        onChange={handleInputChange}
                                                        className={`w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent ${formErrors.email ? 'border-red-500' : 'border-gray-300'}`}
                                                        placeholder="email@contoh.com"
                                                    />
                                                    {formErrors.email && <p className="text-red-500 text-xs mt-1">{formErrors.email}</p>}
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Alamat Lengkap *</label>
                                                    <textarea
                                                        name="address"
                                                        value={orderData.address}
                                                        onChange={handleInputChange}
                                                        rows="3"
                                                        className={`w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent ${formErrors.address ? 'border-red-500' : 'border-gray-300'}`}
                                                        placeholder="Jalan, nomor rumah, RT/RW, dll"
                                                    />
                                                    {formErrors.address && <p className="text-red-500 text-xs mt-1">{formErrors.address}</p>}
                                                </div>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">Kota *</label>
                                                        <input
                                                            type="text"
                                                            name="city"
                                                            value={orderData.city}
                                                            onChange={handleInputChange}
                                                            className={`w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent ${formErrors.city ? 'border-red-500' : 'border-gray-300'}`}
                                                            placeholder="Nama kota"
                                                        />
                                                        {formErrors.city && <p className="text-red-500 text-xs mt-1">{formErrors.city}</p>}
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium text-gray-700 mb-1">Kode Pos *</label>
                                                        <input
                                                            type="text"
                                                            name="postalCode"
                                                            value={orderData.postalCode}
                                                            onChange={handleInputChange}
                                                            className={`w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent ${formErrors.postalCode ? 'border-red-500' : 'border-gray-300'}`}
                                                            placeholder="12345"
                                                        />
                                                        {formErrors.postalCode && <p className="text-red-500 text-xs mt-1">{formErrors.postalCode}</p>}
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Catatan (Opsional)</label>
                                                    <textarea
                                                        name="notes"
                                                        value={orderData.notes}
                                                        onChange={handleInputChange}
                                                        rows="2"
                                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                                        placeholder="Catatan tambahan untuk pesanan"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-lg font-semibold mb-4 text-blue-600">📋 Ringkasan Pesanan</h3>
                                            <div className="bg-gray-50 rounded-lg p-4 mb-4 max-h-64 overflow-y-auto">
                                                {cart.map(item => (
                                                    <div key={item.id} className="flex justify-between items-center py-2 border-b last:border-b-0">
                                                        <div className="flex-1">
                                                            <p className="font-medium text-sm">{item.name}</p>
                                                            <p className="text-xs text-gray-500">{item.quantity} x {formatPrice(item.price)}</p>
                                                        </div>
                                                        <p className="font-semibold text-sm">{formatPrice(item.price * item.quantity)}</p>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="border-t pt-4 mb-4">
                                                <div className="flex justify-between mb-2">
                                                    <span className="text-gray-600">Subtotal</span>
                                                    <span className="font-semibold">{formatPrice(getTotal())}</span>
                                                </div>
                                                <div className="flex justify-between mb-2">
                                                    <span className="text-gray-600">Ongkos Kirim</span>
                                                    <span className="font-semibold text-green-600">GRATIS</span>
                                                </div>
                                                <div className="flex justify-between text-lg font-bold border-t pt-2 mt-2">
                                                    <span>Total</span>
                                                    <span className="text-blue-600">{formatPrice(getTotal())}</span>
                                                </div>
                                            </div>

                                            <h4 className="font-semibold mb-3">Metode Pembayaran *</h4>
                                            <div className="space-y-2">
                                                <label className="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                                                    <input
                                                        type="radio"
                                                        name="paymentMethod"
                                                        value="transfer"
                                                        checked={orderData.paymentMethod === 'transfer'}
                                                        onChange={handleInputChange}
                                                        className="mr-3"
                                                    />
                                                    <div>
                                                        <p className="font-medium">Transfer Bank</p>
                                                        <p className="text-xs text-gray-500">BCA, BNI, Mandiri, BRI</p>
                                                    </div>
                                                </label>
                                                <label className="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                                                    <input
                                                        type="radio"
                                                        name="paymentMethod"
                                                        value="ewallet"
                                                        checked={orderData.paymentMethod === 'ewallet'}
                                                        onChange={handleInputChange}
                                                        className="mr-3"
                                                    />
                                                    <div>
                                                        <p className="font-medium">E-Wallet</p>
                                                        <p className="text-xs text-gray-500">GoPay, OVO, Dana, ShopeePay</p>
                                                    </div>
                                                </label>
                                                <label className="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                                                    <input
                                                        type="radio"
                                                        name="paymentMethod"
                                                        value="cod"
                                                        checked={orderData.paymentMethod === 'cod'}
                                                        onChange={handleInputChange}
                                                        className="mr-3"
                                                    />
                                                    <div>
                                                        <p className="font-medium">COD (Bayar di Tempat)</p>
                                                        <p className="text-xs text-gray-500">Bayar saat barang diterima</p>
                                                    </div>
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-6 flex gap-3">
                                        <button
                                            type="button"
                                            onClick={() => setShowCheckout(false)}
                                            className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg hover:bg-gray-300 transition-colors font-semibold"
                                        >
                                            Kembali
                                        </button>
                                        <button
                                            type="button"
                                            onClick={handleSubmitOrder}
                                            className="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition-colors font-semibold"
                                        >
                                            Bayar Sekarang
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showSuccess && completedOrder && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-lg max-w-md w-full p-8 text-center animate-fade-in">
                                <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 animate-checkmark">
                                    <svg className="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                                    </svg>
                                </div>
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">Pesanan Berhasil!</h2>
                                <p className="text-gray-600 mb-4">Terima kasih telah berbelanja di Toko Online kami.</p>
                                <div className="bg-gray-50 rounded-lg p-4 mb-4 text-left">
                                    <p className="text-sm text-gray-600 mb-1">Nomor Pesanan:</p>
                                    <p className="text-lg font-bold text-blue-600">{orderNumber}</p>
                                    <p className="text-sm text-gray-600 mt-2 mb-1">Total Pembayaran:</p>
                                    <p className="text-lg font-bold text-green-600">{formatPrice(completedOrder.total)}</p>
                                </div>
                                <p className="text-sm text-gray-500 mb-6">
                                    Kami akan mengirimkan konfirmasi pesanan dan informasi pengiriman ke email Anda.
                                </p>
                                <div className="space-y-3">
                                    <button
                                        onClick={generatePDF}
                                        className="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors font-semibold flex items-center justify-center gap-2"
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                        </svg>
                                        Download Nota PDF
                                    </button>
                                    <button
                                        onClick={closeSuccess}
                                        className="w-full bg-gray-200 text-gray-700 py-3 rounded-lg hover:bg-gray-300 transition-colors font-semibold"
                                    >
                                        Lanjut Belanja
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedProduct && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" onClick={() => setSelectedProduct(null)}>
                            <div 
                                className="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto animate-fade-in"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <img 
                                    src={selectedProduct.image} 
                                    alt={selectedProduct.name}
                                    className="w-full h-64 object-cover"
                                />
                                <div className="p-6">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h2 className="text-2xl font-bold mb-2">{selectedProduct.name}</h2>
                                            <span className="inline-block bg-blue-100 text-blue-800 text-sm px-3 py-1 rounded-full">
                                                {selectedProduct.category}
                                            </span>
                                        </div>
                                        <button 
                                            onClick={() => setSelectedProduct(null)}
                                            className="text-gray-500 hover:text-gray-700 text-2xl"
                                        >
                                            ×
                                        </button>
                                    </div>
                                    <p className="text-gray-700 mb-4">{selectedProduct.description}</p>
                                    <p className="text-3xl font-bold text-blue-600 mb-6">{formatPrice(selectedProduct.price)}</p>
                                    <button 
                                        onClick={() => {
                                            addToCart(selectedProduct);
                                            setSelectedProduct(null);
                                        }}
                                        className="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors font-semibold"
                                    >
                                        Tambah ke Keranjang
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
